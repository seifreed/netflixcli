version: "2"

# gosimple is part of staticcheck in golangci-lint v2 (its S1xxx checks run under
# the staticcheck linter), so enabling staticcheck covers the gosimple checks.
linters:
  enable:
    - staticcheck
    - govet
    - errcheck
    - gosec
    - revive
    - ineffassign
    - unused
    - gocritic
  settings:
    errcheck:
      # Closing a response body / connection / read-only file on a cleanup path
      # yields an error nothing can act on. These are the only excluded functions.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    gosec:
      excludes:
        # G304: this is a CLI whose job is to read files the user names on the
        # command line (--file, config) — a "tainted path" is intended input.
        - G304
        # G404: math/rand is used only for backoff jitter, never anything
        # security-sensitive, so a weak RNG is correct (and faster) here.
        - G404
        # G104: redundant with errcheck (already enabled).
        - G104
  exclusions:
    rules:
      # gosec audits the shipped binary's code, not test scaffolding. httptest
      # stub servers deliberately echo request input into responses — intentional
      # test patterns. Scope gosec to non-test code; every other linter still runs.
      - path: _test\.go
        linters:
          - gosec
